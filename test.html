<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Asset & Library Test</title>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- GSAP & Plugins -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
  
  <!-- Three.js & Controls -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  
  <!-- Lenis Smooth Scroll -->
  <script src="https://cdn.jsdelivr.net/npm/@studio-freight/lenis@1.0.42/bundled/lenis.min.js"></script>
</head>
<body style="background:#101713; color:#F5EFE3; font-family:'Inter', sans-serif; padding:2rem;">
  <h1 style="font-family:'Cormorant Garamond', serif; color:#C99A52;">Testing Libraries and Assets</h1>
  <img src="assets/logo/RAWAYAN Farm Golden Emblem.png" style="max-height:100px;" alt="Logo" id="test-logo">
  <div id="status">Checking...</div>
  <script>
    const status = document.getElementById('status');
    const hasGsap = typeof gsap !== 'undefined';
    const hasScrollTrigger = typeof ScrollTrigger !== 'undefined';
    const hasThree = typeof THREE !== 'undefined';
    const hasOrbit = typeof THREE !== 'undefined' && typeof THREE.OrbitControls !== 'undefined';
    const hasLenis = typeof Lenis !== 'undefined';
    status.innerHTML = `
      GSAP: ${hasGsap}<br>
      ScrollTrigger: ${hasScrollTrigger}<br>
      Three.js: ${hasThree}<br>
      OrbitControls: ${hasOrbit}<br>
      Lenis: ${hasLenis}
    `;
  </script>
</body>
</html>
